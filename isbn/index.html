<style>
:root{--bg:#f5f3ee;--ink:#111;--muted:#777;--line:#171717;--paper:#fffdf8;--ok:#16863d;--warn:#d66b00;--bad:#b52222}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}
button,input{font:inherit}
button{cursor:pointer}
header{border-bottom:2px solid #111;background:#fff}
.rainbow{height:7px;background:linear-gradient(90deg,#f33 0 14.28%,#ff9d00 14.28% 28.56%,#ffe600 28.56% 42.84%,#39b54a 42.84% 57.12%,#00a6de 57.12% 71.4%,#2457d6 71.4% 85.68%,#a33bd6 85.68%)}
.head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;gap:12px}
.brand{font-weight:900;letter-spacing:.08em;font-size:15px}
.code{font-family:monospace;font-size:11px;border:1px solid #111;padding:4px 7px}
main{max-width:1200px;margin:auto;padding:18px}
h1{font-size:clamp(28px,5vw,58px);line-height:.92;margin:5px 0 12px;font-weight:900;letter-spacing:-.055em}
.kicker{font:700 12px monospace;letter-spacing:.13em;text-transform:uppercase}
.sub{max-width:780px;color:#444;line-height:1.45}
.layout{display:grid;grid-template-columns:minmax(300px,1.05fr) minmax(320px,.95fr);gap:16px;margin-top:18px}
.panel{background:var(--paper);border:2px solid #111;box-shadow:6px 6px 0 #111}
.panelhead{border-bottom:2px solid #111;padding:9px 11px;font:900 11px monospace;letter-spacing:.12em}
.camera{position:relative;background:#111;aspect-ratio:4/3;overflow:hidden}
video{width:100%;height:100%;object-fit:cover;display:block}
.scanbox{position:absolute;left:10%;right:10%;top:29%;height:42%;border:2px solid white;box-shadow:0 0 0 999px rgba(0,0,0,.22);pointer-events:none}
.scanbox:before,.scanbox:after{content:"";position:absolute;width:28px;height:28px;border-color:#fff}
.scanbox:before{left:-2px;top:-2px;border-left:4px solid;border-top:4px solid}
.scanbox:after{right:-2px;bottom:-2px;border-right:4px solid;border-bottom:4px solid}
.camstatus{position:absolute;left:10px;bottom:10px;background:#111;color:#fff;padding:7px 9px;font:11px monospace}
.controls{display:flex;gap:8px;flex-wrap:wrap;padding:10px;border-top:2px solid #111}
.btn{border:2px solid #111;background:#fff;padding:10px 13px;font-weight:900}
.btn.primary{background:#111;color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.manual{display:flex;gap:8px;padding:0 10px 10px}
.manual input{min-width:0;flex:1;border:2px solid #111;background:#fff;padding:10px;font-family:monospace}
.status{padding:10px;border-top:1px solid #bbb;font:12px monospace;min-height:38px}
.inspection{padding:16px}
.bigisbn{font:900 clamp(22px,4vw,38px) monospace;letter-spacing:.03em;word-break:break-all}
.badge{display:inline-block;border:1px solid #111;padding:4px 6px;font:10px monospace;font-weight:900;margin:4px 4px 0 0}
.badge.ok{background:#dff5e6}.badge.wait{background:#eee}.badge.warn{background:#ffe8c7}.badge.bad{background:#ffd8d8}
.cover{width:150px;max-width:38%;height:auto;border:1px solid #111;background:#eee;object-fit:cover}
.booktop{display:flex;gap:14px;align-items:flex-start;margin:12px 0}
.title{font-size:25px;font-weight:900;line-height:1.02}
.meta{margin-top:8px;color:#444;font-size:13px;line-height:1.45}
.book-description{margin-top:18px;border-top:2px solid #111;padding-top:12px}
.book-description .label{margin-bottom:6px}
.book-description-text{font-size:13px;line-height:1.55;color:#222;max-width:78ch}
.book-subjects{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.subject{border:1px solid #111;padding:4px 6px;font:10px monospace}
.fields{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid #111}
.field{padding:9px 0;border-bottom:1px solid #bbb}
.field:nth-child(odd){padding-right:12px;border-right:1px solid #bbb}
.field:nth-child(even){padding-left:12px}
.label{font:10px monospace;color:#777;text-transform:uppercase}
.value{font-size:13px;font-weight:700;margin-top:2px}
.sources{margin-top:18px}
.source-group{margin-top:22px}
.source-group:first-child{margin-top:12px}
.source-group-title{font:10px monospace;font-weight:900;letter-spacing:.12em;text-transform:uppercase;padding:8px 0 7px;border-bottom:2px solid #111}

.source-name{font-weight:900;letter-spacing:.01em}

.source-link:hover{color:#ff5000!important}

.consensus strong{font-size:18px}
.conflict{margin-top:10px;padding:9px;background:#ffe8c7;border-left:5px solid var(--warn);font-size:12px}
.global{margin-top:16px}

.region{border:1px solid #111;padding:8px;background:#fff;font-size:11px}
.region b{display:block;font-size:12px;margin-bottom:5px}
.region a{display:block;color:#ff5000!important;text-decoration:underline;margin:4px 0}
a{color:#ff5000}
.note{font:10px monospace;color:#666;padding:10px;border-top:1px solid #bbb;line-height:1.45}
.hidden{display:none}
@media(max-width:800px){
 .layout{grid-template-columns:1fr}

<body>
<header><div class="rainbow"></div></header>

<main>
<div class="kicker">Sacrisoft</div>
<h1>ISBN Inspector™</h1>


<div class="layout">
<section class="panel">
  <div class="panelhead">ACQUISITION — BARCODE + OCR</div>
  <div class="camera">
    <video id="video" autoplay muted playsinline></video>
    <div class="scanbox"></div>
    <div class="camstatus" id="camStatus">CAMERA OFFLINE</div>
  </div>
  <div class="controls">
    <button class="btn primary" id="start">START CAMERA</button>
    <button class="btn" id="stop" disabled>STOP</button>
  </div>
  <div class="manual">
    <input id="isbnInput" placeholder="ENTER ISBN-10 / ISBN-13">
    <button class="btn" id="inspect">INSPECT</button>
  </div>
  <div class="status" id="scanStatus">READY</div>
</section>

<section class="panel global" id="bibliographicPanel">
 <div class="panelhead">BIBLIOGRAPHIC RECORD / GLOBAL CATALOGUE</div>
 <div class="inspection">
   <div class="kicker">Object status</div>
   <div class="bigisbn" id="isbnDisplay">NO ISBN</div>
   <div class="meta" id="exactNotice"></div>
   <div id="summary">Awaiting identification.</div>
   <div id="diagnostic" class="meta"></div>
   <div id="book"></div>
   <div id="consensus"></div>
 </div>
</section>
<section class="panel" id="sourceResultsPanel">
  <div class="panelhead">SOURCE RESULTS</div>
  <div class="inspection">
    <div class="sources" id="sources"></div>
  </div>
</section>
<section class="panel global" id="platformsPanel">
 <div class="panelhead">PLATFORMS</div>
 <div class="inspection">

   <div id="amazonStatus" class="meta">Awaiting ISBN.</div>
   <div id="amazonLinks" class="platforms-grid"></div>
 </div>
</section>
</div>

<section class="panel institutions-panel hidden" id="institutionsPanel">
  <details id="institutionsDetails">
    <summary class="panelhead institutions-summary">WORLD INSTITUTIONS</summary>
    <div class="institutions-inner">
      <div id="institutionsGrid" class="institutions-grid"></div>
    </div>
  </details>
</section>

</main>

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function normalizeISBN(raw){
 let s=(raw||'').toUpperCase().replace(/[\s-]/g,'');
 if(/^97[89]\d{10}$/.test(s) && check13(s)) return s;
 if(/^\d{9}[\dX]$/.test(s) && check10(s)) return to13(s);
 return null;
}
function check13(s){let sum=0;for(let i=0;i<13;i++)sum+=+s[i]*(i%2?3:1);return sum%10===0}
function check10(s){let sum=0;for(let i=0;i<10;i++)sum+=(s[i]==='X'?10:+s[i])*(10-i);return sum%11===0}
function to13(s){
 // ISBN-10 converts only to the 978 prefix.
 // A 979 ISBN-13 is NEVER converted through this function.
 let core='978'+s.slice(0,9),sum=0;
 for(let i=0;i<12;i++)sum+=+core[i]*(i%2?3:1);
 return core+(10-sum%10)%10;
}

async function startCamera(){
 if(stream)return;
 stopped=false;
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
  video.srcObject=stream; await video.play();
  camStatus.textContent='CAMERA ONLINE';
  scanStatus.textContent='ZXING + OCR ACTIVE — HOLD ISBN INSIDE FRAME';
  $('start').disabled=true;$('stop').disabled=false;
  const z=await loadZXing();
  if(z?.BrowserMultiFormatReader){
   const hints=new Map();
   if(z.DecodeHintType && z.BarcodeFormat){
    hints.set(z.DecodeHintType.POSSIBLE_FORMATS,[z.BarcodeFormat.EAN_13]);
    hints.set(z.DecodeHintType.TRY_HARDER,true);
   }
   reader=new z.BrowserMultiFormatReader(hints);
   reader.decodeFromVideoElement(video,(result,err)=>{
    if(stopped||!result)return;
    const raw=(result.getText()||'').replace(/[^0-9]/g,'');
    // ISBN-13 on a book is encoded as EAN-13. Never rewrite a barcode value.
    if(raw.length===13 && /^97[89]/.test(raw) && check13(raw)) acceptCandidate(raw,'EAN-13 BARCODE');
   });
  }
  startOCR();
 }catch(e){
  camStatus.textContent='CAMERA ERROR';
  scanStatus.textContent='CAMERA ERROR — '+e.message;
 }
}
function stopCamera(){
 stopped=true;
 if(reader){try{reader.reset()}catch{} reader=null}
 if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
 video.srcObject=null;camStatus.textContent='CAMERA OFFLINE';$('start').disabled=false;$('stop').disabled=true;
}
$('start').onclick=startCamera;$('stop').onclick=stopCamera;

async function startOCR(){
 if(ocrWorker)return;
 try{
  const T=await import('https://cdn.jsdelivr.net/npm/tesseract.js@7/+esm');
  ocrWorker=await T.createWorker('eng');
  scanStatus.textContent='ZXING + OCR ACTIVE — OCR FALLBACK READY';
  ocrLoop();
 }catch(e){scanStatus.textContent='BARCODE ACTIVE — OCR ENGINE UNAVAILABLE'}
}
async function ocrLoop(){
 while(stream&&!stopped){
  if(!ocrBusy&&video.readyState>=2){
   ocrBusy=true;
   try{
    const c=document.createElement('canvas'),ctx=c.getContext('2d');
    const w=video.videoWidth,h=video.videoHeight;
    const sx=w*.08,sy=h*.25,sw=w*.84,sh=h*.5;
    c.width=Math.min(1400,sw*1.5);c.height=Math.min(800,sh*1.5);
    ctx.drawImage(video,sx,sy,sw,sh,0,0,c.width,c.height);
    const {data}=await ocrWorker.recognize(c);
    const text=data.text||'';
    const upper=text.toUpperCase();
    const labeled=[...upper.matchAll(/ISBN(?:-1[03])?[\\s:\-]*([0-9X\\s-]{10,20})/g)].map(m=>m[1]);
    const generic=[...upper.matchAll(/97[89](?:[\\s-]?\\d){10}/g)].map(m=>m[0]);
    const matches=[...labeled,...generic];
    for(const m of matches){
      const isbn=normalizeISBN(m);
      if(isbn) acceptOCRCandidate(isbn);
    }
   }catch{}
   ocrBusy=false;
  }
  await new Promise(r=>setTimeout(r,1700));
 }
}
function acceptCandidate(isbn,method){
 scanStatus.textContent=`${method} CANDIDATE: ${isbn} / EXACT BARCODE`;
 inspectISBN(isbn);
}
function acceptOCRCandidate(isbn){
 if(isbn===lastOCRCandidate){
   confirmations++;
 }else{
   lastOCRCandidate=isbn;
   confirmations=1;
 }
 scanStatus.textContent=`OCR CANDIDATE: ${isbn} / EXACT READ ${confirmations}/2`;
 // OCR is deliberately conservative: the exact same valid ISBN must be read twice.
 if(confirmations>=2){
   inspectISBN(isbn);
   confirmations=0;
   lastOCRCandidate='';
 }
}

async function discoverOpenLibrary(isbn){
 try{
  const u='https://openlibrary.org/search.json?q='+encodeURIComponent(isbn)+'&fields=key,title,author_name,publisher,first_publish_year,isbn,edition_key,cover_i&limit=10';
  const j=await fetch(u).then(r=>r.ok?r.json():null);
  const docs=j?.docs||[];
  const exact=docs.find(d=>(d.isbn||[]).map(x=>x.replace(/-/g,'')).includes(isbn));
  const d=exact||docs[0];
  if(!d)return null;
  return {
   source:'OPEN LIBRARY DISCOVERY',
   exact:!!exact,
   title:d.title,
   authors:(d.author_name||[]).join(', '),
   publisher:(d.publisher||[])[0],
   date:d.first_publish_year,
   cover:d.cover_i?'https://covers.openlibrary.org/b/id/'+d.cover_i+'-M.jpg':null,
   subjects:normalizeSubjects(d.subject),
   url:d.key?'https://openlibrary.org'+d.key:linkFor('open',isbn),
   note:exact?'Exact ISBN in search index':'Discovery result — verify edition'
  };
 }catch{return null}
}
async function discoverGoogle(isbn){
 try{
  const queries=[
   'isbn:'+isbn,
   '"'+isbn+'"',
   isbn
  ];
  for(const q of queries){
   const j=await fetch('https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent(q)+'&maxResults=20').then(r=>r.ok?r.json():null);
   const items=j?.items||[];
   if(!items.length)continue;
   const exact=items.find(x=>(x.volumeInfo?.industryIdentifiers||[]).some(i=>i.identifier.replace(/-/g,'')===isbn));
   const v=(exact||items[0]).volumeInfo||{};
   return {
    source:'GOOGLE BOOKS DISCOVERY',
    exact:!!exact,
    title:[v.title,v.subtitle].filter(Boolean).join(': '),
    authors:(v.authors||[]).join(', '),
    publisher:v.publisher,
    date:v.publishedDate,
    pages:v.pageCount,
    cover:v.imageLinks?.thumbnail?.replace('http:','https:'),
    url:(exact||items[0]).volumeInfo?.infoLink||googleUrl(isbn),
    note:exact?'Exact ISBN in volume metadata':'Search result — verify edition'
   };
  }
 }catch{}
 return null;
}
async function discoverCrossref(isbn){
 try{
  const qs=[
   'https://api.crossref.org/works?query.bibliographic='+encodeURIComponent(isbn)+'&rows=10',
   'https://api.crossref.org/works?filter='+encodeURIComponent('isbn:'+isbn)+'&rows=10'
  ];
  for(const u of qs){
   const j=await fetch(u).then(r=>r.ok?r.json():null);
   const item=j?.message?.items?.[0];
   if(item)return {
    source:'CROSSREF DISCOVERY',
    exact:(item.ISBN||[]).map(x=>x.replace(/-/g,'')).includes(isbn),
    title:item.title?.[0],
    authors:(item.author||[]).map(a=>[a.given,a.family].filter(Boolean).join(' ')).join(', '),
    publisher:item.publisher,
    date:item.published?.['date-parts']?.[0]?.join('-'),
    url:item.URL||'https://search.crossref.org/?q='+encodeURIComponent(isbn),
    note:'DOI metadata discovery'
   };
  }
 }catch{}
 return null;
}
async function discoveryPhase(isbn){
 const [a,b,c]=await Promise.all([
  discoverOpenLibrary(isbn),
  discoverGoogle(isbn),
  discoverCrossref(isbn)
 ]);
 return [a,b,c].filter(Boolean);
}

async function inspectISBN(isbn){
  const scanStatus = document.getElementById("scanStatus");
  if (scanStatus) scanStatus.textContent = "Searching databases...";

  showInstitutions();
 $('isbnDisplay').textContent=isbn;
 renderCommercialDiscovery(isbn);
 $('exactNotice').textContent='EXACT ISBN PASSED TO LOOKUP: '+isbn;
 $('summary').innerHTML='<span class="badge wait">QUERYING</span>';
 $('book').innerHTML='';
 $('consensus').innerHTML='';
 $('diagnostic').textContent='';
 const apiSources=SOURCES.filter(s=>s.type==='api');
 setSources(apiSources.map(s=>sourceRow(s.name,'QUERYING','',linkFor(s.id,isbn))));
 const jobs=[
  queryOpen(isbn),queryGoogle(isbn),queryBnF(isbn),queryLOC(isbn),
  queryDNB(isbn),queryCrossref(isbn),queryArchive(isbn),queryWikidata(isbn)
 ];
 const results=await Promise.all(jobs);
 const valid=results.filter(Boolean);
 const links=SOURCES.filter(s=>s.type==='link').map(s=>sourceRow(s.name,'SEARCH LINK','',linkFor(s.id,isbn)));

 if(valid.length){
   renderBook(merge(valid),valid);
   const extra=links;
   setSources(results.map((r,i)=>r?sourceRow(r.source,'FOUND',r.note||'Bibliographic record found',r.url||''):sourceRow(apiSources[i].name,'NO MATCH','No exact direct record',linkFor(apiSources[i].id,isbn))).concat(extra));
   scanStatus.textContent='INSPECTION COMPLETE — '+valid.length+' DIRECT RECORD(S)';
   $('diagnostic').textContent='Exact/direct records found. The accepted ISBN is '+isbn+'.';
   return;
 }

 $('summary').innerHTML='<span class="badge warn">NO EXACT RECORD</span> DISCOVERY';
 const discovered=await discoveryPhase(isbn);

 if(discovered.length){
   const exact=discovered.filter(x=>x.exact);
   renderDiscovery(discovered,isbn);
   const rows=apiSources.map(s=>sourceRow(s.name,'NO MATCH','',linkFor(s.id,isbn)));
   rows.push(...discovered.map(r=>sourceRow(r.source,r.exact?'FOUND':'CANDIDATE',r.note,r.url)));
   rows.push(...links);
   setSources(rows);
   scanStatus.textContent='DISCOVERY COMPLETE — '+discovered.length+' POSSIBLE RECORD(S)';
   $('diagnostic').textContent=exact.length
    ? 'An exact ISBN match was found during discovery.'
    : 'The ISBN is valid but direct edition records were absent; discovery found bibliographic candidates. The ISBN was not altered.';
 }else{
   $('summary').innerHTML='<span class="badge warn">ISBN VERIFIED / NO RECORD</span>';
   $('book').innerHTML='<div class="meta" style="margin-top:12px">No bibliographic record returned.</div>';
   $('consensus').innerHTML='<div class="consensus"><div class="kicker">Coverage result</div><strong>0 bibliographic records</strong></div>';
   setSources(apiSources.map(s=>sourceRow(s.name,'NO MATCH','',linkFor(s.id,isbn))).concat(links));
   scanStatus.textContent='NO BIBLIOGRAPHIC RECORDS – Please check out the platforms and libraries...';
   $('diagnostic').textContent='Important: '+isbn+' was accepted exactly. No automatic replacement or correction occurred.';
 }
}

 };
 return [...new Set(v.map(x=>{
   const raw=typeof x==='string' ? x : (x?.key||x?.name||'');
   const key=raw.split('/').pop().toLowerCase();
   return map[key] || raw.replace(/^\/languages\//i,'').replace(/^\w{2,3}[-_]/,'').trim();
 }).filter(Boolean))].join(', ');
}
function bestValue(rs,key){
 const vals=rs.map(r=>r[key]).filter(v=>v!==undefined&&v!==null&&v!=='');
 return vals[0]||'';
}

async function queryOpen(isbn){
 try{
  let d=null;
  try{
   const j=await fetch('https://openlibrary.org/isbn/'+isbn+'.json').then(r=>r.ok?r.json():null);
   if(j)d=j;
  }catch{}
  if(!d){
   const j=await fetch('https://openlibrary.org/api/books?bibkeys=ISBN:'+isbn+'&jscmd=data&format=json').then(r=>r.ok?r.json():null);
   d=j?.['ISBN:'+isbn]||null;
  }
  if(!d)return null;
  const publishers=d.publishers||[];
  const authors=d.authors||d.by_statement?[]:[];
  return {
   source:'OPEN LIBRARY',
   title:d.title,
   subtitle:d.subtitle,
   authors:authors.map(a=>a.name||a.key).join(', '),
   publisher:publishers.map(p=>p.name||p).join(', '),
   date:d.publish_date,
   pages:d.number_of_pages||d.number_of_pages_median,
   description:cleanDescription(d.description),
   subjects:normalizeSubjects(d.subjects),
   format:d.physical_format,
   edition:d.edition_name,
   language:normalizeLanguages(d.languages),
   dimensions:[d.physical_dimensions,d.weight].filter(Boolean).join(' · '),
   cover:d.cover?.medium||d.cover?.large||d.covers?.[0]&&('https://covers.openlibrary.org/b/id/'+d.covers[0]+'-M.jpg'),
   url:d.url||linkFor('open',isbn),
   note:'Edition record'
  };
 }catch{return null}
}
async function queryGoogle(isbn){
 try{
  const u='https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent('isbn:'+isbn)+'&maxResults=10';
  const j=await fetch(u).then(r=>r.ok?r.json():null);
  const items=j?.items||[];
  const exact=items.find(x=>(x.volumeInfo?.industryIdentifiers||[]).some(i=>i.identifier.replace(/-/g,'')===isbn));
  const item=exact||items[0];
  if(!item)return null;
  const v=item.volumeInfo||{};
  return {
   source:'GOOGLE BOOKS',
   title:v.title,
   subtitle:v.subtitle,
   authors:(v.authors||[]).join(', '),
   publisher:v.publisher,
   date:v.publishedDate,
   pages:v.pageCount,
   description:cleanDescription(v.description),
   subjects:v.categories||[],
   format:v.printType,
   language:v.language,
   dimensions:[v.dimensions?.height,v.dimensions?.width,v.dimensions?.thickness].filter(Boolean).join(' × ') || '',
   cover:v.imageLinks?.extraLarge||v.imageLinks?.large||v.imageLinks?.medium||v.imageLinks?.thumbnail?.replace('http:','https:'),
   url:v.infoLink||googleUrl(isbn),
   note:exact?'Exact ISBN match':'ISBN query result — edition match should be verified'
  };
 }catch{return null}
}
function toISBN10(isbn13){
 if(!/^97[89]\d{10}$/.test(isbn13))return null;
 const core=isbn13.slice(3,12); let sum=0;
 for(let i=0;i<9;i++)sum+=(10-i)*+core[i];
 const r=(11-sum%11)%11;
 return core+(r===10?'X':r);
}
async function queryBnF(isbn){
 try{
  const q=encodeURIComponent('bib.anywhere all "'+isbn+'"');
  const u='https://catalogue.bnf.fr/api/SRU?version=1.2&operation=searchRetrieve&query='+q+'&maximumRecords=3';
  const xml=await fetch(u).then(r=>r.text());
  const doc=new DOMParser().parseFromString(xml,'application/xml');
  const rec=doc.querySelector('record');
  if(!rec)return null;
  const vals=[...rec.querySelectorAll('subfield')].map(x=>x.textContent.trim()).filter(Boolean);
  const title=vals.find(x=>x.length>3);
  return {source:'BnF / FRANCE',title:title||'BnF bibliographic record',url:bnfUrl(isbn),note:'SRU record returned'};
 }catch{return null}
}
async function queryLOC(isbn){
 try{
  const u='https://www.loc.gov/books/?q='+encodeURIComponent(isbn)+'&fo=json&c=5';
  const j=await fetch(u).then(r=>r.json());
  const r=(j.results||[]).find(x=>JSON.stringify(x).includes(isbn))||(j.results||[])[0];
  if(!r)return null;
  return {source:'LIBRARY OF CONGRESS',title:r.title,authors:Array.isArray(r.contributors)?r.contributors.join(', '):r.contributor,publisher:r.date,date:r.date,url:r.id||linkFor('loc',isbn),note:'LoC JSON record'};
 }catch{return null}
}
async function queryDNB(isbn){
 try{
  const q=encodeURIComponent('num='+isbn);
  const u='https://services.dnb.de/sru/dnb?version=1.1&operation=searchRetrieve&query='+q+'&maximumRecords=3&recordSchema=oai_dc';
  const xml=await fetch(u).then(r=>r.text());
  if(!/<record/i.test(xml))return null;
  const doc=new DOMParser().parseFromString(xml,'application/xml');
  const title=doc.querySelector('dc\\\\:title,title')?.textContent?.trim();
  return {source:'DEUTSCHE NATIONALBIBLIOTHEK',title:title||'DNB bibliographic record',url:dnbUrl(isbn),note:'SRU record returned'};
 }catch{return null}
}

async function queryCrossref(isbn){
 try{
  const u='https://api.crossref.org/works?filter='+encodeURIComponent('isbn:'+isbn)+'&rows=5';
  const j=await fetch(u,{headers:{'Accept':'application/json'}}).then(r=>r.json());
  const item=(j.message?.items||[])[0];
  if(!item)return null;
  return {source:'CROSSREF',title:item.title?.[0],authors:(item.author||[]).map(a=>[a.given,a.family].filter(Boolean).join(' ')).join(', '),publisher:item.publisher,date:item.published?.['date-parts']?.[0]?.join('-'),pages:item.page,description:cleanDescription(item.abstract),url:item.URL||'https://search.crossref.org/?q='+encodeURIComponent(isbn),note:'ISBN-filtered DOI metadata'};
 }catch{return null}
}
async function queryArchive(isbn){
 try{
  const u='https://archive.org/advancedsearch.php?q='+encodeURIComponent('isbn:'+isbn)+'&fl[]=identifier,title,creator,year,description&rows=10&page=1&output=json';
  const j=await fetch(u).then(r=>r.json());
  const d=(j.response?.docs||[])[0];
  if(!d)return null;
  return {source:'INTERNET ARCHIVE',title:d.title,authors:Array.isArray(d.creator)?d.creator.join(', '):d.creator,date:d.year,description:cleanDescription(d.description),url:'https://archive.org/details/'+encodeURIComponent(d.identifier),note:'Archive search record'};
 }catch{return null}
}
async function queryWikidata(isbn){
 try{
  const sparql=`SELECT ?item ?itemLabel ?authorLabel ?publisherLabel ?date WHERE {
    ?item wdt:P212 "${isbn}".
    OPTIONAL {?item wdt:P50 ?author.}
    OPTIONAL {?item wdt:P123 ?publisher.}
    OPTIONAL {?item wdt:P577 ?date.}
    SERVICE wikibase:label { bd:serviceParam wikibase:language "en". }
  } LIMIT 5`;
  const u='https://query.wikidata.org/sparql?format=json&query='+encodeURIComponent(sparql);
  const j=await fetch(u,{headers:{'Accept':'application/sparql-results+json'}}).then(r=>r.json());
  const b=j.results?.bindings?.[0];
  if(!b)return null;
  return {source:'WIKIDATA',title:b.itemLabel?.value,authors:b.authorLabel?.value,publisher:b.publisherLabel?.value,date:b.date?.value?.slice(0,10),url:b.item?.value,note:'ISBN property match'};
 }
 catch{return null}
}

function merge(rs){
 const get=k=>rs.map(r=>r[k]).find(v=>v!==undefined&&v!==null&&v!=='');
 const descriptions=rs.map(r=>r.description).filter(Boolean).sort((a,b)=>b.length-a.length);
 const subjectList=[...new Set(rs.flatMap(r=>Array.isArray(r.subjects)?r.subjects:[]))].slice(0,14);
 const title=get('title'),subtitle=get('subtitle'),authors=get('authors'),publisher=get('publisher'),date=get('date'),pages=get('pages'),cover=get('cover');
 const conflicts=[];
 for(const k of ['title','authors','publisher','date','pages']){
  const vals=[...new Set(rs.map(r=>r[k]).filter(v=>v!==undefined&&v!==null&&v!==''))];
  if(vals.length>1)conflicts.push([k,vals]);
 }
 return {
  title,subtitle,authors,publisher,date,pages,cover,
  description:descriptions[0]||'',
  subjects:subjectList,
  format:get('format'),
  edition:get('edition'),
  language:get('language'),
  dimensions:get('dimensions'),
  conflicts
 };
}
function renderBook(m,rs){
 $('summary').innerHTML=`<span class="badge ok">IDENTITY CONFIRMED</span> <span class="badge ok">${rs.length} DIRECT SOURCE${rs.length===1?'':'S'}</span>`;
 const fields=[
  ['ISBN',$('isbnDisplay').textContent],
  ['Publisher',m.publisher],
  ['Publication',m.date],
  ['Pages',m.pages],
  ['Format',m.format],
  ['Language',m.language],
  ['Edition',m.edition],
  ['Dimensions',m.dimensions]
 ];
 $('book').innerHTML=`
  <div class="booktop">
   ${m.cover?`<img class="cover" src="${esc(m.cover)}" alt="Book cover">`:''}
   <div>
    <div class="title">${esc(m.title||'Title unavailable')}</div>
    ${m.subtitle?`<div class="meta">${esc(m.subtitle)}</div>`:''}
    <div class="meta">${esc(m.authors||'Author unavailable')}</div>
   </div>
  </div>
  <div class="fields">
   ${fields.map(([a,b])=>`<div class="field"><div class="label">${esc(a)}</div><div class="value">${esc(b||'—')}</div></div>`).join('')}
   <div class="field"><div class="label">Sources</div><div class="value">${rs.length} direct records</div></div>
   <div class="field"><div class="label">Edition confidence</div><div class="value">${m.conflicts.length?'CONFLICT':'HIGH'}</div></div>
  </div>
  ${m.subjects.length?`<div class="book-description"><div class="label">Subjects</div><div class="book-subjects">${m.subjects.map(s=>`<span class="subject">${esc(s)}</span>`).join('')}</div></div>`:''}
  ${m.description?`<div class="book-description"><div class="label">Synopsis</div><div class="book-description-text">${esc(m.description)}</div></div>`:''}
 `;

 const score=Math.round((rs.length/SOURCES.filter(s=>s.type==='api').length)*100);
 let h=`<div class="consensus"><div class="kicker">Source consensus</div><strong>${score}% direct-source coverage</strong>`;
 if(m.conflicts.length){
   h+=`<div class="conflict"><b>BIBLIOGRAPHIC CONFLICT</b><br>${m.conflicts.map(c=>esc(c[0])+': '+c[1].map(esc).join(' / ')).join('<br>')}</div>`;
 }else{
   h+='<div class="meta">No conflicting core fields.</div>';
 }
 h+='</div>';
 $('consensus').innerHTML=h;
 updateConditionalSections();
}
