Open chrisweil.com/sync/phone.html and scan with phone
</h1>

Creating connection...
</h2>



<button onclick="startAnswerScanner()">

SCAN PHONE QR

</button>

<script>


let pc;

let channel;


async function createConnection(){



pc =
new RTCPeerConnection({

iceServers:[]

});




channel =
pc.createDataChannel("arcade");





channel.onopen=()=>{

console.log("CONNECTED");

startGame();

startGameEngine();

};





channel.onmessage=e=>{

if(window.gameInput){

gameInput(e.data);

}

};





await pc.setLocalDescription(

await pc.createOffer()

);





pc.onicecandidate=e=>{


if(!e.candidate){

showOfferQR();

}


};



}







function showOfferQR(){



document
.getElementById("offerQR")
.innerHTML="";



new QRCode(

document.getElementById("offerQR"),

{

text:

JSON.stringify(
pc.localDescription
),


width:500,

height:500,


correctLevel:
QRCode.CorrectLevel.L


}

);



document
.getElementById("status")
.innerHTML=
"Waiting for phone...";


}









async function startAnswerScanner(){



await navigator.mediaDevices.getUserMedia({

video:true,

audio:false

});





document
.getElementById("offerScreen")
.style.display="none";



document
.getElementById("scannerScreen")
.style.display="block";





const scanner =
new Html5Qrcode("reader");







await scanner.start(


{

facingMode:"user"

},




{


fps:20,


qrbox:{

width:600,

height:600

},


aspectRatio:1.0



},




async text=>{


console.log(
"ANSWER QR RECEIVED:",
text.length
);



await scanner.stop();





let answer =
JSON.parse(text);





await pc.setRemoteDescription(answer);



},



error=>{}



);



}









function startGame(){



document
.getElementById("scannerScreen")
.style.display="none";



document
.getElementById("game")
.style.display="block";


}







createConnection();



</script>

function hit(a,b){return a.x<b.x+(b.w||b.size)&&a.x+a.size>b.x&&a.y<b.y+(b.h||b.size)&&a.y+a.size>b.y}
